name: Android

# Compila la app de Android (Capacitor). En cada push a main publica el APK
# como release de GitHub; en los PR solo verifica que compile.
#
# Configuración (Settings → Secrets and variables → Actions):
#   Variable CAP_SERVER_URL      URL de producción que abre la app. Obligatoria en main.
#   Secretos (opcionales) para firmar siempre con la misma llave:
#     ANDROID_KEYSTORE_BASE64, ANDROID_KEYSTORE_PASSWORD,
#     ANDROID_KEY_ALIAS, ANDROID_KEY_PASSWORD
#   Sin esos secretos se firma con una llave de debug guardada en el caché de
#   Actions: sirve para instalar a mano, pero si el caché se pierde (7 días sin
#   builds) la próxima versión no se instala encima y hay que desinstalar.

on:
  push:
    branches: [main]
    paths:
      - "android/**"
      - "capacitor.config.ts"
      - "capacitor/**"
      - "package.json"
      - "package-lock.json"
      - ".github/workflows/android.yml"
  pull_request:
    paths:
      - "android/**"
      - "capacitor.config.ts"
      - "capacitor/**"
      - "package.json"
      - "package-lock.json"
      - ".github/workflows/android.yml"
  workflow_dispatch:

permissions:
  contents: write

jobs:
  apk:
    runs-on: ubuntu-24.04
    env:
      PUBLISH: ${{ github.event_name != 'pull_request' }}
      ANDROID_VERSION_CODE: ${{ github.run_number }}
      ANDROID_VERSION_NAME: 1.0.${{ github.run_number }}
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: 21
          cache: gradle

      - name: URL de la app
        env:
          URL: ${{ vars.CAP_SERVER_URL }}
        run: |
          if [ -z "$URL" ]; then
            if [ "$PUBLISH" = "true" ]; then
              echo "::error::Falta la variable CAP_SERVER_URL (Settings → Secrets and variables → Actions → Variables) con la URL de producción."
              exit 1
            fi
            # En un PR alcanza con verificar que compile.
            URL=https://example.invalid
          fi
          echo "CAP_SERVER_URL=$URL" >> "$GITHUB_ENV"

      - run: npm ci
      - run: npx cap sync android

      - name: Llave de firma (secretos)
        id: release_key
        env:
          KEYSTORE: ${{ secrets.ANDROID_KEYSTORE_BASE64 }}
          STORE_PASS: ${{ secrets.ANDROID_KEYSTORE_PASSWORD }}
          ALIAS: ${{ secrets.ANDROID_KEY_ALIAS }}
          KEY_PASS: ${{ secrets.ANDROID_KEY_PASSWORD }}
        run: |
          if [ -n "$KEYSTORE" ]; then
            echo "$KEYSTORE" | base64 -d > "$RUNNER_TEMP/release.jks"
            {
              echo "ANDROID_KEYSTORE_PATH=$RUNNER_TEMP/release.jks"
              echo "ANDROID_KEYSTORE_PASSWORD=$STORE_PASS"
              echo "ANDROID_KEY_ALIAS=$ALIAS"
              echo "ANDROID_KEY_PASSWORD=$KEY_PASS"
            } >> "$GITHUB_ENV"
            echo "signed=true" >> "$GITHUB_OUTPUT"
          else
            echo "signed=false" >> "$GITHUB_OUTPUT"
          fi

      - name: Llave de debug (caché)
        if: steps.release_key.outputs.signed != 'true'
        uses: actions/cache@v4
        with:
          path: ~/.android/debug.keystore
          key: android-debug-keystore-v1

      - name: Compilar
        working-directory: android
        run: |
          if [ "${{ steps.release_key.outputs.signed }}" = "true" ]; then
            ./gradlew --no-daemon assembleRelease
            cp app/build/outputs/apk/release/app-release.apk ../Chartly.apk
          else
            ./gradlew --no-daemon assembleDebug
            cp app/build/outputs/apk/debug/app-debug.apk ../Chartly.apk
          fi

      - uses: actions/upload-artifact@v4
        with:
          name: Chartly-${{ env.ANDROID_VERSION_NAME }}
          path: Chartly.apk

      - name: Publicar release
        if: env.PUBLISH == 'true'
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          gh release create "android-${ANDROID_VERSION_NAME}" Chartly.apk \
            --target "$GITHUB_SHA" \
            --title "Chartly para Android ${ANDROID_VERSION_NAME}" \
            --notes "Descargá **Chartly.apk** desde el teléfono y abrilo para instalar. Commit: ${GITHUB_SHA::7}." \
            --latest
